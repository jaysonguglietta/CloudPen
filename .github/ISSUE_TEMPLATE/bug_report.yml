name: Bug report
description: Report a reproducible non-security defect using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include credentials, customer data, live evidence, personal data, or internal URLs here. Follow SECURITY.md for private reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps using only local or synthetic data.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: Git commit SHA
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options:
        - Local built Worker
        - Local development server
        - Private Sites deployment
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks performed
      description: Include relevant test commands and sanitized results.
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, credentials, customer data, live evidence, personal data, and internal URLs.
          required: true
